<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSONP Google Apps Script Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin: 15px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="url"], input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: #007bff;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border-color: #bee5eb;
        }
        .console-log {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>🧪 JSONP Google Apps Script Test</h1>
    <p>This is a clean test to verify JSONP connection with Google Apps Script (no caching issues).</p>
    
    <form id="testForm">
        <div class="form-group">
            <label for="webAppUrl">Google Apps Script Web App URL:</label>
            <input type="url" id="webAppUrl" 
                   placeholder="https://script.google.com/macros/s/.../exec" 
                   required>
        </div>
        
        <div class="form-group">
            <label for="spreadsheetId">Google Sheets Spreadsheet ID:</label>
            <input type="text" id="spreadsheetId" 
                   placeholder="1RjtGRVKfpGe3St04vD0l7DfNYqZMis8aKBE_15ezs3A" 
                   required>
        </div>
        
        <button type="submit">🚀 Test JSONP Connection</button>
        <button type="button" onclick="testDataSync()">📊 Test Data Sync</button>
        <button type="button" onclick="clearLog()">🧹 Clear Log</button>
    </form>
    
    <div id="status" class="status" style="display: none;"></div>
    
    <h3>Console Log:</h3>
    <div id="consoleLog" class="console-log"></div>

    <script>
        function log(message) {
            const consoleDiv = document.getElementById('consoleLog');
            const timestamp = new Date().toLocaleTimeString();
            consoleDiv.textContent += `[${timestamp}] ${message}\n`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            console.log(message);
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
        }

        function clearLog() {
            document.getElementById('consoleLog').textContent = '';
            document.getElementById('status').style.display = 'none';
        }

        async function testConnection() {
            const webAppUrl = document.getElementById('webAppUrl').value.trim();
            const spreadsheetId = document.getElementById('spreadsheetId').value.trim();
            
            if (!webAppUrl || !spreadsheetId) {
                showStatus('Please fill in both fields', 'error');
                return;
            }

            showStatus('Testing JSONP connection...', 'info');
            log('Starting JSONP connection test...');
            log(`URL: ${webAppUrl}`);
            log(`Spreadsheet ID: ${spreadsheetId}`);

            try {
                const callbackName = 'testCallback_' + Date.now();
                const script = document.createElement('script');
                
                const result = await new Promise((resolve, reject) => {
                    log(`Creating JSONP callback: ${callbackName}`);
                    
                    window[callbackName] = function(data) {
                        log('JSONP Response received:');
                        log(JSON.stringify(data, null, 2));
                        delete window[callbackName];
                        if (document.head.contains(script)) {
                            document.head.removeChild(script);
                        }
                        resolve(data);
                    };
                    
                    script.onerror = function() {
                        log('JSONP script failed to load');
                        delete window[callbackName];
                        if (document.head.contains(script)) {
                            document.head.removeChild(script);
                        }
                        reject(new Error('JSONP script failed to load'));
                    };
                    
                    const jsonpUrl = `${webAppUrl}?callback=${callbackName}&test=true`;
                    log(`JSONP URL: ${jsonpUrl}`);
                    
                    script.src = jsonpUrl;
                    document.head.appendChild(script);
                    log('JSONP script tag added to page');
                    
                    setTimeout(() => {
                        if (window[callbackName]) {
                            delete window[callbackName];
                            if (document.head.contains(script)) {
                                document.head.removeChild(script);
                            }
                            reject(new Error('JSONP request timeout - no response after 10 seconds'));
                        }
                    }, 10000);
                });
                
                if (result.success) {
                    showStatus('✅ JSONP Connection successful!', 'success');
                    log('✅ Connection test passed!');
                } else {
                    throw new Error(result.error || 'Unknown error');
                }
                
            } catch (error) {
                log(`❌ Connection test failed: ${error.message}`);
                showStatus(`❌ Connection failed: ${error.message}`, 'error');
            }
        }

        async function testDataSync() {
            const webAppUrl = document.getElementById('webAppUrl').value.trim();
            
            if (!webAppUrl) {
                showStatus('Please enter Web App URL first', 'error');
                return;
            }

            showStatus('Testing JSONP data sync...', 'info');
            log('Starting JSONP data sync test...');

            try {
                const callbackName = 'dataSyncCallback_' + Date.now();
                const script = document.createElement('script');
                
                const testData = {
                    values: [['Test User', 'Test Client', new Date().toISOString(), '', '', '', '', 'Test Entry']]
                };
                
                const result = await new Promise((resolve, reject) => {
                    window[callbackName] = function(data) {
                        log('Data sync JSONP response:');
                        log(JSON.stringify(data, null, 2));
                        delete window[callbackName];
                        if (document.head.contains(script)) {
                            document.head.removeChild(script);
                        }
                        resolve(data);
                    };
                    
                    script.onerror = function() {
                        log('Data sync JSONP script failed');
                        delete window[callbackName];
                        if (document.head.contains(script)) {
                            document.head.removeChild(script);
                        }
                        reject(new Error('Data sync JSONP failed'));
                    };
                    
                    const dataParam = encodeURIComponent(JSON.stringify(testData));
                    const jsonpUrl = `${webAppUrl}?callback=${callbackName}&data=${dataParam}`;
                    log(`Data sync URL length: ${jsonpUrl.length}`);
                    
                    script.src = jsonpUrl;
                    document.head.appendChild(script);
                    
                    setTimeout(() => {
                        if (window[callbackName]) {
                            delete window[callbackName];
                            if (document.head.contains(script)) {
                                document.head.removeChild(script);
                            }
                            reject(new Error('Data sync timeout'));
                        }
                    }, 15000);
                });
                
                if (result.success) {
                    showStatus('✅ Data sync successful!', 'success');
                    log('✅ Data sync test passed!');
                } else {
                    throw new Error(result.error || 'Data sync failed');
                }
                
            } catch (error) {
                log(`❌ Data sync failed: ${error.message}`);
                showStatus(`❌ Data sync failed: ${error.message}`, 'error');
            }
        }

        document.getElementById('testForm').addEventListener('submit', function(e) {
            e.preventDefault();
            testConnection();
        });

        // Initialize with known values
        window.addEventListener('load', function() {
            document.getElementById('spreadsheetId').value = '1RjtGRVKfpGe3St04vD0l7DfNYqZMis8aKBE_15ezs3A';
            log('JSONP Test Page loaded - ready to test!');
        });
    </script>
</body>
</html>
